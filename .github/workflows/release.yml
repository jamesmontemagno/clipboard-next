name: Release

on:
  push:
    tags:
      - 'v*-mac'
  workflow_dispatch:
    inputs:
      version:
        description: 'macOS release tag (e.g., v1.0.0-mac)'
        required: true
        type: string

env:
  SCHEME: ClipboardNext
  PRODUCT_NAME: ClipboardNext
  APPLE_TEAM_ID: 8P95D2238B

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: xcode-27

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Resolve version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}-mac$ ]]; then
            echo "macOS release tags must look like v1.2.3-mac or v1.2.3.4-mac. Got '$TAG'."
            exit 1
          fi

          VERSION="${TAG#v}"
          VERSION="${VERSION%-mac}"
          echo "MARKETING_VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Test
        run: |
          xcodebuild test \
            -project ${{ env.SCHEME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=macOS' \
            -derivedDataPath $RUNNER_TEMP/TestData \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      - name: Install Apple Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_MACOS_DIRECT_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MACOS_DIRECT_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          echo -n "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain

          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build and Archive (universal)
        run: |
          xcodebuild archive \
            -project ${{ env.SCHEME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath $RUNNER_TEMP/${{ env.PRODUCT_NAME }}.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            MARKETING_VERSION=${{ env.MARKETING_VERSION }} \
            CURRENT_PROJECT_VERSION=${{ env.BUILD_NUMBER }} \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"

      - name: Export Archive
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/${{ env.PRODUCT_NAME }}.xcarchive \
            -exportPath $RUNNER_TEMP/Export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Notarize App
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_REFRACTORED_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_REFRACTORED_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_REFRACTORED_P8_KEY }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY" > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Export/${{ env.PRODUCT_NAME }}.app" \
            "$RUNNER_TEMP/${{ env.PRODUCT_NAME }}-notarize.zip"

          SUBMISSION_OUTPUT=$(xcrun notarytool submit "$RUNNER_TEMP/${{ env.PRODUCT_NAME }}-notarize.zip" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json)

          echo "$SUBMISSION_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | jq -r '.id')
          STATUS=$(echo "$SUBMISSION_OUTPUT" | jq -r '.status')

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed with status: $STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID"
            exit 1
          fi

          xcrun stapler staple "$RUNNER_TEMP/Export/${{ env.PRODUCT_NAME }}.app"

      - name: Verify Signature
        run: |
          APP="$RUNNER_TEMP/Export/${{ env.PRODUCT_NAME }}.app"
          spctl -a -vv "$APP"
          codesign -dvv "$APP"
          lipo -archs "$APP/Contents/MacOS/${{ env.PRODUCT_NAME }}"

      - name: Create Distribution ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Export/${{ env.PRODUCT_NAME }}.app" \
            "$RUNNER_TEMP/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_TAG }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Clipboard Next for macOS ${{ env.RELEASE_TAG }}
          files: ${{ runner.temp }}/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_TAG }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        run: |
          RELEASE_SHA=$(shasum -a 256 "$RUNNER_TEMP/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_TAG }}.zip" | awk '{print $1}')
          sed -i '' "s/version \".*\"/version \"${{ env.MARKETING_VERSION }}\"/" Casks/clipboard-next.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$RELEASE_SHA\"/" Casks/clipboard-next.rb
          cat Casks/clipboard-next.rb

      - name: Create cask update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          commit-message: "Update Homebrew cask for ${{ env.RELEASE_TAG }}"
          branch: release-metadata/${{ env.RELEASE_TAG }}
          delete-branch: true
          title: "Update Homebrew cask for ${{ env.RELEASE_TAG }}"
          body: Updates `Casks/clipboard-next.rb` with the version and SHA-256 from the `${{ env.RELEASE_TAG }}` release workflow.
          add-paths: Casks/clipboard-next.rb

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
