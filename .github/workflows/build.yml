name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "**.md"]
  pull_request:
    paths-ignore: ["site/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      # CI has no signing certificate, so build and test ad-hoc signed.
      - name: Test
        run: |
          xcodebuild test \
            -project ClipboardNext.xcodeproj \
            -scheme ClipboardNext \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      - name: Build Release (universal)
        run: |
          xcodebuild build \
            -project ClipboardNext.xcodeproj \
            -scheme ClipboardNext \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          lipo -archs build/Build/Products/Release/ClipboardNext.app/Contents/MacOS/ClipboardNext
