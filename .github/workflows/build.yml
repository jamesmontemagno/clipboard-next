name: Build

on:
  push:
    branches: [main]
    # The Windows app has its own workflow (windows-build.yml).
    paths-ignore:
      - "site/**"
      - "**.md"
      - "windows/**"
      - "global.json"
      - ".github/workflows/windows-*.yml"
      - ".github/actions/**"
  pull_request:
    paths-ignore:
      - "site/**"
      - "**.md"
      - "windows/**"
      - "global.json"
      - ".github/workflows/windows-*.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      # CI has no signing certificate, so build and test ad-hoc signed.
      - name: Test
        run: |
          xcodebuild test \
            -project ClipboardNext.xcodeproj \
            -scheme ClipboardNext \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      - name: Build Release (universal)
        run: |
          xcodebuild build \
            -project ClipboardNext.xcodeproj \
            -scheme ClipboardNext \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          lipo -archs build/Build/Products/Release/ClipboardNext.app/Contents/MacOS/ClipboardNext
