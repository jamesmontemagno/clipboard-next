<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Clipboard Next</title>
  <desc id="description">Stay in your demo, not in your notes. Queue commands and paste them one at a time. Free for macOS and Windows.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22c3a6"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ae98ff"/>
      <stop offset="1" stop-color="#63e2c6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7c5cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint">
      <stop stop-color="#22c3a6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#22c3a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0d0f1a"/>
  <ellipse cx="995" cy="210" rx="620" ry="490" fill="url(#glow)"/>
  <ellipse cx="200" cy="630" rx="610" ry="350" fill="url(#mint)"/>
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <g transform="translate(60 58)">
    <rect width="58" height="58" rx="14" fill="url(#brand)"/>
    <g transform="scale(.90625)" fill="none" stroke="#fff" stroke-width="4">
      <rect x="17" y="15" width="30" height="37" rx="5"/>
      <rect x="24" y="10" width="16" height="9" rx="3" fill="#fff" stroke="none"/>
      <path d="M27 33h8m-3-5 5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="134" y="97" fill="#eef0ff" font-size="32" font-weight="700" letter-spacing="-1">Clipboard Next</text>
    <text x="62" y="192" fill="#63e2c6" font-size="15" font-weight="700" letter-spacing="2.5">LESS ALT-TAB. MORE FLOW.</text>
    <text x="58" y="272" fill="#eef0ff" font-size="58" font-weight="700" letter-spacing="-2.5">Stay in your demo.</text>
    <text x="58" y="342" fill="url(#headline)" font-size="58" font-weight="700" letter-spacing="-2.5">Not in your notes.</text>
    <text x="62" y="401" fill="#b0b6d2" font-size="22">Queue commands. Paste. Keep presenting.</text>

    <rect x="60" y="451" width="284" height="44" rx="22" fill="#22c3a6" fill-opacity=".09" stroke="#22c3a6" stroke-opacity=".3"/>
    <circle cx="82" cy="473" r="4" fill="#63e2c6"/>
    <text x="97" y="480" fill="#d4fff2" font-size="17" font-weight="700">Free for macOS + Windows</text>
    <text x="62" y="562" fill="#eef0ff" font-size="21" font-weight="700">clipboardnext.com</text>
    <text x="1138" y="562" text-anchor="end" fill="#a3a8c7" font-size="16">Local only. Open source. Ready for the stage.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="690" y="153" width="448" height="172" rx="16" fill="#0a0c14" stroke="#3b365b"/>
    <path d="M690 197h448" stroke="#2a2f4a"/>
    <circle cx="712" cy="175" r="5" fill="#ff5f57"/>
    <circle cx="730" cy="175" r="5" fill="#febc2e"/>
    <circle cx="748" cy="175" r="5" fill="#28c840"/>
    <text x="773" y="181" fill="#a3a8c7" font-size="14">Terminal / live demo</text>
    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="21">
      <text x="714" y="242" fill="#c9f7e9"><tspan fill="#ae98ff">$ </tspan>dotnet new web</text>
      <text x="714" y="280" fill="#c9f7e9"><tspan fill="#ae98ff">$ </tspan>dotnet run</text>
    </g>

    <rect x="730" y="348" width="408" height="153" rx="16" fill="#171b2d" stroke="#3b365b"/>
    <text x="751" y="379" fill="#eef0ff" font-size="16" font-weight="700">Your demo queue</text>
    <rect x="1031" y="361" width="86" height="26" rx="13" fill="#22c3a6" fill-opacity=".14"/>
    <text x="1074" y="379" text-anchor="middle" fill="#63e2c6" font-size="13" font-weight="700">2 / 3 ready</text>
    <path d="M751 409h365" stroke="#2a2f4a"/>
    <text x="752" y="438" fill="#6d7598" font-size="18">1</text>
    <text x="780" y="438" fill="#858ca9" font-family="Consolas, 'Liberation Mono', monospace" font-size="18">dotnet new web</text>
    <rect x="746" y="450" width="375" height="36" rx="8" fill="#22c3a6" fill-opacity=".1"/>
    <path d="m755 466 5 5 9-10" fill="none" stroke="#63e2c6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="780" y="474" fill="#c9f7e9" font-family="Consolas, 'Liberation Mono', monospace" font-size="18">dotnet run</text>
    <text x="1106" y="473" text-anchor="end" fill="#63e2c6" font-size="12" font-weight="700">ON CLIPBOARD</text>
  </g>
</svg>
